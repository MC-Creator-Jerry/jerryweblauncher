# ============================================================
#  jerryweblauncher-site / wrangler.toml
#  Independent Cloudflare Pages project: jerryweblauncher (网站启动台)
#  纯静态 + 薄 SSO 后端（身份来自小蓝页 IdP）。
# ============================================================
name = "jerryweblauncher"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# 启动台独立 KV：仅存 SSO 会话与一次性 state
[[kv_namespaces]]
binding = "LAUNCHER_KV"
id = "42750c66990542f788a17f142cee1bd8"
