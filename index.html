<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Jerry 网站启动台 —— 一键直达 Jerry 的全部网站：小蓝页、茶馆、片屿、书栈、音乐电台、每日全球要闻、噪音警报器。">
<meta name="theme-color" content="#0b1220">
<title>Jerry 网站启动台</title>
<link rel="icon" href="favicon.svg?v=20261021b" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=20261020c">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0a6fb5"/>
              <stop offset="1" stop-color="#2bb3ed"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" fill="url(#brandG)"/>
          <path d="M9 9 L56 22 L38 34 Z" fill="#ffffff"/>
          <path d="M9 9 L38 34 L23 56 Z" fill="#ffffff" opacity="0.72"/>
        </svg>
        <div class="brand-text">
          <h1>Jerry 网站启动台</h1>
          <p class="brand-sub">Launcher · 一键直达全部站点</p>
        </div>
      </div>
      <div class="header-right">
        <div class="clock" aria-label="当前时间">
          <span class="clock-time" id="clockTime">--:--</span>
          <span class="clock-date" id="clockDate"></span>
        </div>
        <div class="hdr-auth" id="hdrRight"></div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅主题" title="切换深浅主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索网站…（按 / 快速聚焦）" autocomplete="off" spellcheck="false" aria-label="搜索网站">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
    </div>

    <nav class="chips" id="chips" aria-label="分类筛选"></nav>

    <section class="tile-grid" id="tileGrid" aria-label="网站入口"></section>

    <p class="empty-tip" id="emptyTip" hidden>没有匹配的网站，换个关键词试试。</p>
  </main>

  <footer class="site-footer">
    <p>共 <b id="siteCount">0</b> 个站点 · 快捷键：<kbd>/</kbd> 搜索 · <kbd>1</kbd>–<kbd>7</kbd> 直达 · <kbd>Esc</kbd> 清空</p>
    <p class="foot-by">Built by Jerry · MC-Creator-Jerry</p>
  </footer>

  <script src="auth.js?v=20261020b" defer></script>
  <script src="app.js?v=20261020b" defer></script>
</body>
</html>
